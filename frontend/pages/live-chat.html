<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live chat · CALMS</title>
<!-- Live chat with website visitors: when Kuwa (the guide on the public site) can't help, a visitor asks for a person and
     waits here. Join a chat to answer it; what they asked Kuwa first is shown above the conversation.
     For the Sales Agent, Loan Processor, Loan Account Officer, Operations Manager and System Administrator.
     Data: /api/live (backend/src/routes/live.js). -->
<style>
  :root { --bg: #f7f1ea; --card: #fffaf4; --ink: #2a1810; --soft: #6e5446; --mute: #9a8072; --line: #e6d8ca; --a: #c0562f; --a2: #e8892a; --me: #c0562f; --ok: #2f8f5b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161009; --card: #20170f; --ink: #f6e8da; --soft: #cdb6a4; --mute: #9a8072; --line: #3a2a20; --a: #e8892a; --a2: #f3cf7a; --me: #b9531f; --ok: #5cc38a; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1200px; height: 100%; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-rows: auto 1fr; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font: 600 28px/1.1 Georgia, serif; } .sub { margin: 6px 0 0; color: var(--soft); max-width: 680px; }
  a { color: inherit; }
  .app { display: grid; grid-template-columns: 320px 1fr; gap: 14px; min-height: 0; }
  .list, .pane { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 0; }
  .list { overflow-y: auto; padding: 8px; }
  .list h2 { margin: 10px 10px 6px; font: 600 12px/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: inherit; font: inherit; cursor: pointer; }
  .item:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); } .item[aria-current="true"] { background: color-mix(in srgb, var(--a) 12%, transparent); }
  .item b { font-weight: 600; } .item small { color: var(--mute); font-size: 12px; } .item span { grid-column: 1 / -1; color: var(--soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-style: normal; justify-self: end; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--soft); }
  .tag.wait { background: var(--a); color: #fff; } .tag.open { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); } .tag.n { background: var(--a); color: #fff; }
  .pane { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .head h3 { margin: 0; font: 600 18px/1.2 system-ui, sans-serif; } .head p { margin: 2px 0 0; color: var(--soft); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); margin-right: 6px; vertical-align: 1px; } .dot.on { background: var(--ok); }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font: 600 14px/1 system-ui, sans-serif; cursor: pointer; background: var(--a); color: #fff; } .btn.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .msgs { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 72%; padding: 9px 13px; border-radius: 14px; white-space: pre-line; overflow-wrap: anywhere; }
  .m.v { align-self: flex-start; background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .m.a { align-self: flex-end; background: var(--me); color: #fff; }
  .m small { display: block; font-size: 11px; opacity: .65; margin-top: 3px; }
  .sys { align-self: center; color: var(--mute); font-size: 12.5px; text-align: center; }
  details.kuwa { align-self: stretch; border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; color: var(--soft); font-size: 13.5px; }
  details.kuwa summary { cursor: pointer; font-weight: 600; } details.kuwa p { margin: 6px 0 0; } details.kuwa b { color: var(--ink); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  form textarea { flex: 1; resize: none; height: 44px; max-height: 140px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; }
  form textarea:focus { outline: 2px solid color-mix(in srgb, var(--a) 50%, transparent); outline-offset: 0; }
  .empty { display: grid; place-items: center; height: 100%; color: var(--soft); text-align: center; padding: 30px; }
  .msg { padding: 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; } .wrap { height: auto; min-height: 100%; } .pane { min-height: 70vh; } }
</style>
<link rel="stylesheet" href="../assets/css/chat-alert.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Live chat</h1><p class="sub">Website visitors who asked Kuwa for a person. Join a chat to answer it. Don't ask for ID numbers, passwords or codes here; for anything about a loan, ask them to sign in to My GR8 or call the branch. <a href="../index.html">Back to CALMS</a></p></div>
  </header>
  <div id="out" class="app">
    <nav class="list" id="list" aria-label="Chats"><p class="sub" style="padding:10px">Loading...</p></nav>
    <section class="pane" id="pane"><div class="empty">Pick a chat on the left.</div></section>
  </div>
</div>
<script src="../assets/js/live-chat.js"></script>
<script src="../assets/js/chat-alert.js"></script>
</body>
</html>
